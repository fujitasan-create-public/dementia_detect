[project]
name = "dementia-detect"
version = "0.1.0"
description = "Local LLM-based cognitive decline detection from Japanese free dialogue"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=0.30.0",
  "datasets>=2.20.0",
  "numpy>=1.26.0",
  "peft>=0.11.0",
  "pyyaml>=6.0.0",
  "torch>=2.4.0",
  "torchaudio>=2.4.0",
  "torchvision>=0.19.0",
  "transformers>=4.45.0",
  "trl>=0.9.0",
  # NLP
  "spacy>=3.7.0",
  # ML / 説明可能性
  "scikit-learn>=1.4.0",
  "scipy>=1.13.0",
  "shap>=0.45.0",
  # 評価・可視化
  "bert-score>=0.3.13",
  "matplotlib>=3.9.0",
  "seaborn>=0.13.0",
  "plotly>=5.22.0",
  # 実験管理
  "mlflow>=2.13.0",
  # 量子化
  "bitsandbytes>=0.43.0",
]

[project.scripts]
train-lora = "finetune_template.train:main"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
